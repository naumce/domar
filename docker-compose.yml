services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: domar
      POSTGRES_PASSWORD: domar
      POSTGRES_DB: domar
    ports:
      - '54329:5432'
    volumes:
      - domar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U domar']
      interval: 5s
      timeout: 3s
      retries: 10

  # Development only: catches every message the API sends. SMTP on 1025, web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'

volumes:
  domar-pg:
