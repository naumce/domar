services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: domar
      POSTGRES_PASSWORD: domar
      POSTGRES_DB: domar
    ports:
      - '54329:5432'
    volumes:
      - domar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U domar']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  domar-pg:
