services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-domar}
    volumes:
      - domar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-domar}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-domar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-domar}
      NODE_ENV: production
      SERVE_WEB: 'true'
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      CORS_ORIGINS: https://${DOMAIN}
      TRUST_PROXY: '1'
      TZ: ${TZ:-Europe/Skopje}
      PDF_BROWSER_CHANNEL: chromium
    expose:
      - '3001'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  domar-pg:
  caddy-data:
  caddy-config:
