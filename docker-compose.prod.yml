services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-domar}
      TZ: ${TZ:-Europe/Skopje}
    volumes:
      - domar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-domar}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Chromium forks helpers for every PDF; without an init process those become zombies under PID 1.
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # POSTGRES_PASSWORD must be URL-safe (letters, digits, - and _): it goes into this URL unescaped.
      DATABASE_URL: postgres://${POSTGRES_USER:-domar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-domar}
      NODE_ENV: production
      SERVE_WEB: 'true'
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      CORS_ORIGINS: https://${DOMAIN}
      TRUST_PROXY: '1'
      TZ: ${TZ:-Europe/Skopje}
      PDF_BROWSER_CHANNEL: chromium
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-domar <no-reply@${DOMAIN}>}
      JOB_TOKEN: ${JOB_TOKEN:?set JOB_TOKEN in .env}
    expose:
      - '3001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3001/api/health || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  domar-pg:
  caddy-data:
  caddy-config:
